name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check src/ tests/ scripts/

      - name: Run tests
        run: uv run pytest -v

  docs-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Build and stage docs site
        run: scripts/check_doc_links.sh --stage-only

      # Internal links (pages, anchors, assets): offline and blocking.
      - name: Check internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline --no-progress
            --root-dir ${{ github.workspace }}/_linkcheck
            --index-files index.html
            '_linkcheck/**/*.html'
          fail: true
          jobSummary: true

      # External links: informative only, so a flaky third-party site
      # never blocks a PR. Results appear in the job summary.
      - name: Check external links (non-blocking)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-retries 3 --accept 200,206,429
            --root-dir ${{ github.workspace }}/_linkcheck
            --index-files index.html
            '_linkcheck/**/*.html'
          fail: false
          jobSummary: true
          output: lychee/external.md
