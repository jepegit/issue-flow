# Built-in issue-flow workflow modes.
#
# A *mode* selects which workflow surfaces (skills / slash commands) `issue-flow
# init` scaffolds. The chosen mode is persisted to the project's
# `.issueflows/config.toml` so `issue-flow update` refreshes exactly that mode's
# surfaces. Change mode by re-running `issue-flow init --mode <id>`.
#
# Each `[modes.<id>]` table accepts:
#   name         human-readable label
#   description  one-line summary
#   skills       "all", or a list of skill stems (see SKILL_DIRS in templating.py)
#   commands     "all", or a list of command stems (see COMMAND_NAMES)
#   extends      optional base mode id to start from
#   add          optional list of stems to union in (skill and/or command stems)
#   remove       optional list of stems to subtract
#
# Users can add or override modes in their own project's
# `.issueflows/config.toml` using the same `[modes.<id>]` grammar; a mode may
# only reference surface stems that ship as packaged templates. Stems retired by
# a merge (e.g. `iflow_yolo` -> `iflow_run`) are mapped automatically.

[modes.standard]
name = "Standard"
description = "Full issue-flow workflow: planning, PRs, hands-off runs, issue shaping, cleanup, and status."
skills = "all"
commands = "all"

[modes.novice]
name = "Novice"
description = "Guided first-project surface: setup, the linear lifecycle, and the safety nets. No hands-off runs."
skills = [
    "iflow_iflow",
    "iflow_setup",
    "iflow_pick",
    "iflow_issue",
    "iflow_plan",
    "iflow_build",
    "iflow_pause",
    "iflow_close",
    "iflow_cleanup",
    "iflow_status",
]
commands = [
    "iflow",
    "iflow-setup",
    "iflow-pick",
    "iflow-issue",
    "iflow-plan",
    "iflow-build",
    "iflow-pause",
    "iflow-close",
    "iflow-cleanup",
    "iflow-status",
]

[modes.simple]
name = "Simple"
description = "Lightweight markdown-only lifecycle: pick, plan, implement, park, and status. No PR, cleanup, or hands-off automation."
skills = [
    "iflow_iflow",
    "iflow_setup",
    "iflow_pick",
    "iflow_plan",
    "iflow_build",
    "iflow_pause",
    "iflow_status",
]
commands = [
    "iflow",
    "iflow-setup",
    "iflow-pick",
    "iflow-plan",
    "iflow-build",
    "iflow-pause",
    "iflow-status",
]
