# Packaged step execution profiles for issue-flow lifecycle skills.
# Values: "economy" (speed/token economy) or "reasoning" (deep thinking).
# Projects may override per stem in .issueflows/config.toml under
# [issueflow.step_profiles].

[defaults]
iflow_iflow = "economy"
iflow_setup = "reasoning"
iflow_pick = "reasoning"
iflow_plan = "reasoning"
iflow_build = "reasoning"
iflow_pause = "economy"
iflow_close = "economy"
iflow_cleanup = "economy"
iflow_run = "reasoning"
iflow_issue = "reasoning"
iflow_status = "economy"
