# Packaged step execution profiles for issue-flow lifecycle skills.
# Values: "economy" (speed/token economy) or "reasoning" (deep thinking).
# Projects may override per stem in .issueflows/config.toml under
# [issueflow.step_profiles].

[defaults]
iflow_iflow = "economy"
iflow_pick = "reasoning"
iflow_init = "economy"
iflow_comments = "economy"
iflow_plan = "reasoning"
iflow_build = "reasoning"
iflow_pause = "economy"
iflow_close = "economy"
iflow_cleanup = "economy"
iflow_yolo = "reasoning"
iflow_fix = "reasoning"
iflow_issue = "reasoning"
iflow_status = "economy"
iflow_doctor = "economy"
iflow_review = "reasoning"
iflow_archive = "reasoning"
iflow_epic = "reasoning"
iflow_cycle = "reasoning"
iflow_auto = "reasoning"
iflow_version_bump = "economy"
iflow_history_update = "economy"
iflow_graphify = "economy"
